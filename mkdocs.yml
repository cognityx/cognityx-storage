site_name: Cognityx Storage
site_description: Provider-neutral storage boundary for Cognityx services.
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Development: development.md
