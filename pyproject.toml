[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognityx-storage"
version = "0.1.0"
description = "Provider-neutral storage client for Cognityx platform components."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Cognityx" }]
dependencies = ["cognityx-resource"]

[project.optional-dependencies]
dev = ["pytest>=8", "mkdocs-material>=9.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/cognityx_storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
cognityx-resource = { path = "../cognityx-resource" }
